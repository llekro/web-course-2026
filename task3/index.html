<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>Мои задачи</h1>
        
        <div class="add-form">
            <input type="text" id="taskInput" placeholder="Что нужно сделать?">
            <button id="addBtn">Добавить</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Готовые</button>
        </div>

        <p class="stats">Осталось: <span id="leftCount">0</span>, Выполнено: <span id="doneCount">0</span></p>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
