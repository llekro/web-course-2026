<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список задач</h1>
        
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Введите задачу...">
            <button id="addBtn" class="btn">Добавить</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <div class="counter">
            Осталось: <span id="remaining">0</span>, Выполнено: <span id="completed">0</span>
        </div>

        <ul id="todoList" class="todo-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
