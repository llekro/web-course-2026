<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <h1>Simon Game</h1>
        
        <div class="level-display">
            <div class="level-circle">
                <span class="level-number" id="level">0</span>
                <span class="level-label">Уровень</span>
            </div>
        </div>

        <div class="simon-board" id="simonBoard">
            <div class="simon-btn green" data-index="0"></div>
            <div class="simon-btn red" data-index="1"></div>
            <div class="simon-btn yellow" data-index="2"></div>
            <div class="simon-btn blue" data-index="3"></div>
        </div>

        <button id="startBtn" class="btn start-btn">Старт</button>
        
        <div id="message" class="message"></div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
