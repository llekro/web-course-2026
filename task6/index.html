<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Змейка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>Змейка</h1>
        <p class="score">Счёт: <span id="score">0</span></p>
        <div class="board">
            <canvas id="game" width="400" height="400"></canvas>
            <div id="overlay" class="overlay">
                <p class="overlay-title">Игра окончена</p>
                <p class="overlay-score">Итоговый счёт: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="restart-btn" type="button">Начать заново</button>
            </div>
        </div>
        <p class="hint">Управление - стрелки на клавиатуре</p>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
